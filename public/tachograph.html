<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בקרת טכוגרף וצי רכב · ח. סבן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --card-sub: #f1f5f9;
  --ink: #0f172a;
  --mute: #64748b;
  --line: #e2e8f0;
  --brand: #14532d;
  --brand-light: #dcfce7;
  --drive: #0e7490;
  --pto: #d97706;
  --pto-light: #fef3c7;
  --site: #6366f1;
  --ok: #15803d;
  --ok-bg: #dcfce7;
  --warn: #b45309;
  --warn-bg: #fef3c7;
  --bad: #b91c1c;
  --bad-bg: #fee2e2;
  --radius: 14px;
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0f17;
    --card: #131b26;
    --card-sub: #1b2636;
    --ink: #f1f5f9;
    --mute: #94a3b8;
    --line: #202d3f;
    --brand: #22c55e;
    --brand-light: #14532d33;
    --drive: #38bdf8;
    --pto: #fbbf24;
    --pto-light: #78350f33;
    --site: #818cf8;
    --ok: #4ade80;
    --ok-bg: #14532d33;
    --warn: #fbbf24;
    --warn-bg: #78350f33;
    --bad: #f87171;
    --bad-bg: #7f1d1d33;
    --shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  padding: env(safe-area-inset-top, 0) 0 40px;
  line-height: 1.5;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 28px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 50;
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, #14532d, #166534);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 24px;
  box-shadow: 0 4px 10px rgba(20, 83, 45, 0.25);
}

h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.sub { color: var(--mute); font-size: 13px; font-weight: 500; }

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 99px;
  background: var(--card-sub);
  border: 1px solid var(--line);
  font-weight: 600;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10b981;
}

.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 24px; }

/* סרגל דיסקיות */
.strip-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.strip {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 8px;
  scrollbar-width: thin;
}

.disc {
  flex: 0 0 auto;
  min-width: 165px;
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: var(--radius);
  padding: 12px 14px;
  cursor: pointer;
  text-align: right;
  color: inherit;
  font: inherit;
  transition: all 0.2s ease;
  box-shadow: var(--shadow);
}

.disc:hover { border-color: var(--brand); transform: translateY(-1px); }
.disc.on {
  border-color: var(--brand);
  background: var(--brand-light);
  box-shadow: 0 0 0 2px var(--brand) inset;
}
.disc b { display: block; font-size: 15px; font-weight: 700; }
.disc small { color: var(--mute); font-size: 12px; }

/* טאבים ראשיים */
.tabs {
  display: flex;
  gap: 8px;
  margin: 20px 0 16px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 2px;
}

.tab {
  background: none;
  border: 0;
  padding: 10px 18px;
  font: 700 14px 'Heebo', sans-serif;
  color: var(--mute);
  cursor: pointer;
  border-radius: 10px 10px 0 0;
  transition: all 0.2s;
  position: relative;
}

.tab:hover { color: var(--ink); }
.tab.on { color: var(--brand); background: var(--card); }
.tab.on::after {
  content: '';
  position: absolute;
  bottom: -2px;
  right: 0;
  left: 0;
  height: 3px;
  background: var(--brand);
  border-radius: 3px 3px 0 0;
}

/* KPI Cards */
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.k {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
}
.k span { display: block; color: var(--mute); font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.k b { font-size: 24px; font-weight: 900; font-variant-numeric: tabular-nums; }

/* פריסה דו-טורית */
.grid {
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 20px;
}
@media (max-width: 960px) { .grid { grid-template-columns: 1fr; } }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.card h3 {
  margin: 0 0 14px;
  font-size: 15px;
  color: var(--ink);
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* רשימת עצירות וביקורים */
.stop {
  display: grid;
  grid-template-columns: 32px 1fr auto;
  gap: 12px;
  padding: 14px 0;
  border-top: 1px solid var(--line);
  align-items: start;
}
.stop:first-of-type { border-top: 0; }
.n {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--pto);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 13px;
  box-shadow: 0 2px 5px rgba(217, 119, 6, 0.3);
}

.t { font-weight: 700; font-size: 14px; }
.m { color: var(--mute); font-size: 12px; margin-top: 2px; }

.chip {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 99px;
  margin-inline-end: 4px;
  margin-top: 4px;
}
.ok { color: var(--ok); background: var(--ok-bg); }
.warn { color: var(--warn); background: var(--warn-bg); }
.bad { color: var(--bad); background: var(--bad-bg); }

.leg {
  border-right: 2px dashed var(--line);
  margin: -4px 14px 6px 0;
  padding: 4px 18px;
  color: var(--mute);
  font-size: 12px;
  font-weight: 500;
}

/* טבלאות */
table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: right; }
th {
  color: var(--mute);
  font-weight: 700;
  padding: 10px 12px;
  border-bottom: 2px solid var(--line);
  position: sticky;
  top: 0;
  background: var(--card);
}
td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:hover td { background: var(--card-sub); }

input, select {
  font: inherit;
  font-size: 13px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s;
}
input:focus, select:focus { border-color: var(--brand); }

button.btn {
  font: 700 13px 'Heebo', sans-serif;
  padding: 9px 16px;
  border-radius: 10px;
  border: 0;
  background: var(--brand);
  color: #fff;
  cursor: pointer;
  transition: all 0.2s;
}
button.btn:hover { opacity: 0.9; transform: translateY(-1px); }
button.btn:active { transform: translateY(0); }
button.ghost {
  background: none;
  border: 1px solid var(--line);
  color: var(--ink);
}
button.ghost:hover { background: var(--card-sub); border-color: var(--mute); }

.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; min-width: 90px; }
.bar i { display: block; height: 100%; background: var(--pto); border-radius: 4px; }

.scan {
  overflow: hidden;
  border-radius: 12px;
  background: #000;
  min-height: 240px;
  max-height: 380px;
  display: grid;
  place-items: center;
  margin-bottom: 10px;
  border: 1px solid var(--line);
}
.scan img { max-width: 100%; max-height: 380px; object-fit: contain; transition: transform .2s, filter .2s; }

.empty { color: var(--mute); padding: 32px 16px; text-align: center; font-weight: 500; font-size: 14px; }

@media print {
  header button, .tabs, .strip, .noprint { display: none !important; }
  body { background: #fff; color: #000; }
  .card { box-shadow: none; border-color: #ccc; }
}
</style>
</head>
<body>

<header>
  <div class="brand-wrap">
    <div class="logo">ס</div>
    <div>
      <h1>בקרת טכוגרף · סידור עבודה</h1>
      <div class="sub">ח. סבן חומרי בניין (1994) בע"מ · סניפי הוד השרון / גליה</div>
    </div>
  </div>
  <div class="status-pill">
    <span class="status-dot" id="status_dot"></span>
    <span id="conn_status">מחובר ישירות לגיליון</span>
  </div>
</header>

<div class="wrap">
  <div class="strip-header">
    <span class="sub" style="font-weight:700">דיסקיות פעילות במערכת:</span>
  </div>
  <div class="strip" id="strip"></div>
  
  <div class="tabs">
    <button class="tab on" data-t="day">היום וציר זמנים</button>
    <button class="tab" data-t="sites">כתובות ואתרי לקוחות</button>
    <button class="tab" data-t="cities">ערים, חציון ומרחקים</button>
  </div>

  <div id="app">
    <div class="empty">טוען נתונים מהגיליון...</div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// הגדרת חיבור API חסינה
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwR0F9lUa2Fq6C6E4u1eH18f-y4s0iL1o549uWkYw/exec';
const API_TOKEN = 'saban_secure_token_2026';

let D = null, cur = null, tab = 'day';
const num = v => { const x = parseFloat(String(v).replace(/,/g, '')); return isNaN(x) ? null : x; };
const med = a => { a = a.filter(x => x != null && x > 0).sort((x, y) => x - y); return a.length ? a[Math.floor((a.length - 1) / 2)] : null; };

function ymd(s) {
  const m = String(s || '').match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);
  if (!m) return String(s || '').slice(0, 10);
  let y = +m[3]; if (y < 100) y += 2000;
  return y + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
}

function plate(s) {
  const d = String(s || '').replace(/\D/g, '');
  return d.length === 8 ? d.replace(/(\d{3})(\d{2})(\d{3})/, '$1-$2-$3') : '';
}

const eDate = d => ymd(d['תאריך מתוקן'] || d['תאריך דיסקית']);
const ePlate = d => plate(d['משאית מתוקנת'] || d['רישוי / משאית']);

function flags(d) {
  const f = [], y = +eDate(d).slice(0, 4);
  if (!y || y < 2025 || y > new Date().getFullYear() + 1) f.push('שנה חשודה ב-OCR');
  if (!ePlate(d)) f.push('רישוי לא תקני');
  if (!d['ק"מ פתיחה'] && !d['סה"כ ק"מ']) f.push('חסר קילומטראז׳');
  return f;
}

function visitsOf(d) {
  const dt = eDate(d), p = ePlate(d);
  return (D.visits || []).filter(v => v['תאריך'] === dt && (!p || v['משאית'] === p))
    .sort((a, b) => (a['איתוראן: הגעה'] || '99').localeCompare(b['איתוראן: הגעה'] || '99'));
}

const siteOf = k => (D.sites || []).find(s => s['מפתח אתר'] === k);

function init(r) {
  D = r;
  cur = D.discs && D.discs.length ? D.discs[D.discs.length - 1]._row : null;
  strip();
  render();
}

function strip() {
  if (!D || !D.discs || !D.discs.length) {
    $('#strip').innerHTML = '<div class="empty">אין דיסקיות בטאב ארכיון_טכוגרף</div>';
    return;
  }
  $('#strip').innerHTML = D.discs.map(d => `
    <button class="disc ${d._row === cur ? 'on' : ''}" data-r="${d._row}">
      <b>${esc(eDate(d))}</b>
      <small>${esc(ePlate(d) || 'משאית ?')} · ${esc(d['סה"כ ק"מ'] || d['ק"מ פתיחה'] || '—')} ק״מ</small>
    </button>
  `).join('');

  document.querySelectorAll('.disc').forEach(b => b.onclick = () => {
    cur = +b.dataset.r;
    strip();
    render();
  });
}

document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  tab = b.dataset.t;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  render();
});

function ring(vs) {
  const R = 110, C = 130, pt = (h, r) => {
    const a = (h / 24) * 2 * Math.PI - Math.PI / 2;
    return [C + r * Math.cos(a), C + r * Math.sin(a)];
  };
  const hh = t => {
    const m = String(t || '').match(/(\d{1,2}):(\d{2})/);
    return m ? +m[1] + m[2] / 60 : null;
  };

  let s = `<svg viewBox="0 0 260 260" width="100%" role="img" aria-label="טבעת 24 שעות"><circle cx="130" cy="130" r="${R}" fill="none" stroke="var(--line)" stroke-width="20"/>`;
  for (let h = 0; h < 24; h += 3) {
    const [x, y] = pt(h, R + 22);
    s += `<text x="${x}" y="${y + 3}" font-size="9" font-weight="600" text-anchor="middle" fill="var(--mute)">${('0' + h).slice(-2)}</text>`;
  }

  let drawn = 0;
  vs.forEach((v, i) => {
    const a = hh(v['איתוראן: הגעה']), b = hh(v['איתוראן: יציאה']);
    if (a == null || b == null) return;
    drawn++;
    const [x1, y1] = pt(a, R), [x2, y2] = pt(b, R);
    s += `<path d="M${x1} ${y1}A${R} ${R} 0 ${(b - a) > 12 ? 1 : 0} 1 ${x2} ${y2}" fill="none" stroke="var(--site)" stroke-width="20" opacity=".85"/>`;
    const p1 = hh(v['PTO פתיחה']), p2 = hh(v['PTO סגירה']);
    if (p1 != null && p2 != null) {
      const [a1, b1] = pt(p1, R), [a2, b2] = pt(p2, R);
      s += `<path d="M${a1} ${b1}A${R} ${R} 0 0 1 ${a2} ${b2}" fill="none" stroke="var(--pto)" stroke-width="20"/>`;
    }
    const [tx, ty] = pt((a + b) / 2, R);
    s += `<text x="${tx}" y="${ty + 4}" font-size="10" font-weight="900" text-anchor="middle" fill="#fff">${i + 1}</text>`;
  });

  return s + `</svg>` + (drawn ? '' : '<div class="empty">הטבעת תתמלא אוטומטית בהזרקת נתוני איתוראן</div>');
}

function day() {
  const d = (D.discs || []).find(x => x._row === cur);
  if (!d) return '<div class="empty">בחר דיסקית מהסרגל העליון</div>';
  const vs = visitsOf(d), fl = flags(d), meas = vs.filter(v => num(v['משך באתר לסידור (דק׳)']) > 0), pto = vs.reduce((a, v) => a + (num(v['PTO משך (דק׳)']) || 0), 0);
  const kpi = (l, v) => `<div class="k"><span>${l}</span><b>${esc(v || '—')}</b></div>`;

  const rows = vs.map((v, i) => {
    const s = siteOf(v['מפתח אתר']), on = num(v['משך באתר לסידור (דק׳)']), p50 = s && num(s['באתר חציון (דק׳)']), dv = on && p50 ? on - p50 : null;
    return `
      <div class="stop">
        <div class="n">${i + 1}</div>
        <div>
          <div class="t">${esc(v['כתובת'])}</div>
          <div class="m">לקוח: ${esc(v['לקוחות'] || 'כללי')}</div>
          <div class="m">תעודות: ${esc(v['תעודות'] || '—')}${v['איתוראן: הגעה'] ? ` · הגעה: ${esc(v['איתוראן: הגעה'])} ‒ יציאה: ${esc(v['איתוראן: יציאה'])}` : ''}</div>
          ${(v['דגלי איכות'] || '').split('; ').filter(Boolean).map(f => `<span class="chip warn">${esc(f)}</span>`).join('')}
        </div>
        <div style="text-align:left">
          <b style="font-size:15px">${on ? on + ' דק׳' : '—'}</b>
          <div class="m">${esc(v['מקור המדידה'] || 'אין מדידה')}</div>
          ${dv != null ? `<div class="m ${dv > 10 ? 'bad' : 'ok'}" style="font-weight:600">${dv > 0 ? '+' : ''}${Math.round(dv)} מול חציון האתר</div>` : ''}
        </div>
      </div>
      ${v['ק״מ מהעצירה הקודמת'] ? `<div class="leg">↓ ${esc(v['ק״מ מהעצירה הקודמת'])} ק״מ נסיעה · ${esc(v['נסיעה מהעצירה הקודמת (דק׳)'] || '?')} דקות</div>` : ''}
    `;
  }).join('');

  return `
    <div class="kpis">
      ${kpi('סה״כ ק״מ', d['סה"כ ק"מ'] || d['ק"מ פתיחה'])}
      ${kpi('זמן נסיעה', d['זמן נסיעה'])}
      ${kpi('זמן עבודה', d['זמן עבודה'])}
      ${kpi('זמן סרק', d['זמן סרק'])}
      ${kpi('ביקורי לקוח', vs.length)}
      ${kpi('זמן פריקת PTO', pto ? pto + ' דק׳' : '—')}
      ${kpi('כיסוי מדידות', vs.length ? Math.round(meas.length / vs.length * 100) + '%' : '0%')}
    </div>
    <div class="grid">
      <div>
        <div class="card">
          <h3>טבעת פעילות 24H</h3>
          ${ring(vs)}
          <div class="m" style="margin-top:12px;text-align:center">
            ■ <span style="color:var(--site);font-weight:700">שהות באתר</span> &nbsp;&nbsp;
            ■ <span style="color:var(--pto);font-weight:700">עבודת מנוף PTO</span>
          </div>
        </div>
        <div class="card noprint">
          <h3>אימות ובקרת נתונים</h3>
          <div style="margin-bottom:12px">
            ${fl.map(f => `<span class="chip bad">${esc(f)}</span>`).join('') || '<span class="chip ok">ללא חריגות OCR</span>'}
          </div>
          <p style="display:flex;gap:8px;margin-bottom:12px">
            <input id="fd" style="flex:1" placeholder="תאריך dd/mm/yyyy" value="${esc(d['תאריך מתוקן'] || '')}">
            <input id="fp" style="flex:1" placeholder="משאית 615-41-002" value="${esc(d['משאית מתוקנת'] || '')}">
          </p>
          <div style="display:flex;gap:8px">
            <button class="btn ghost" style="flex:1" onclick="save(false)">שמור תיקון</button>
            <button class="btn" style="flex:1" onclick="save(true)">אשר דיסקית</button>
          </div>
          <div class="m" style="margin-top:10px">
            ${d['אושר ע״י'] ? `✓ אושר ע״י: ${esc(d['אושר ע״י'])} · ${esc(d['אושר בתאריך'])}` : 'סטטוס: טרם אושר'}
          </div>
        </div>
        <div class="card noprint">
          <h3>סריקת דיסקית מקורית</h3>
          <div class="scan" id="scan">

          <p style="display:flex;gap:6px;justify-content:center">
            <button class="btn ghost" onclick="tf('rotate')">↻ סובב</button>
            <button class="btn ghost" onclick="tf('inv')">נגטיב</button>
            <button class="btn ghost" onclick="tf('zoom')">זום</button>
          </p>
        </div>
      </div>
      <div class="card">
        <h3>ציר זמנים, מסלול היום והצלבת תעודות (${vs.length} ביקורים)</h3>
        ${rows || '<div class="empty">לא נמצאו ביקורים לתאריך ולמשאית זו בארכיון התעודות.</div>'}
      </div>
    </div>
  `;
}

let T = { r: 0, i: 0, z: 1 };
function tf(k) {
  const im = $('#scan img');
  if (!im) return;
  if (k === 'rotate') T.r = (T.r + 90) % 360;
  if (k === 'inv') T.i = !T.i;
  if (k === 'zoom') T.z = T.z >= 2 ? 1 : T.z + 0.5;
  im.style.transform = `rotate(${T.r}deg) scale(${T.z})`;
  im.style.filter = T.i ? 'invert(1)' : '';
}
