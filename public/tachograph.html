<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>בקרת טכוגרף · ח. סבן</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#17202a;--mute:#6b7280;--line:#e5dfd2;--brand:#14532d;--drive:#0e7490;--pto:#d97706;--site:#7c3aed;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#151b24;--ink:#eef2f6;--mute:#8b98a9;--line:#252e3b;--brand:#4ade80;--drive:#22d3ee;--pto:#fbbf24;--site:#a78bfa;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;padding:env(safe-area-inset-top,0) 0 24px}
header{display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;border-radius:12px;background:var(--brand);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:22px}
h1{font-size:20px;font-weight:800;margin:0}.sub{color:var(--mute);font-size:12px}
.wrap{max-width:1240px;margin:0 auto;padding:18px 24px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.disc{flex:0 0 auto;min-width:150px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px;cursor:pointer;text-align:right;color:inherit;font:inherit}
.disc b{display:block;font-size:15px}.disc small{color:var(--mute)}.disc.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.tabs{display:flex;gap:4px;margin:18px 0 14px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 16px;font:600 14px Heebo;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:var(--ink);border-color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.k span{display:block;color:var(--mute);font-size:12px}.k b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:16px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--mute);font-weight:600}
.stop{display:grid;grid-template-columns:30px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.stop:first-of-type{border-top:0}
.n{width:26px;height:26px;border-radius:50%;background:var(--pto);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.t{font-weight:600}.m{color:var(--mute);font-size:12px}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);margin-inline-end:4px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.leg{border-top:1px dashed var(--line);margin:2px 0 2px 0;padding:4px 40px;color:var(--mute);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:right;color:var(--mute);font-weight:600;padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
td{padding:8px;border-bottom:1px solid var(--line)}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button.btn{font:600 13px Heebo;padding:8px 14px;border-radius:10px;border:0;background:var(--brand);color:var(--bg);cursor:pointer}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--pto)}
.scan{overflow:hidden;border-radius:12px;background:#000;max-height:360px;display:grid;place-items:center}.scan img{max-width:100%;transition:transform .2s,filter .2s}
.empty{color:var(--mute);padding:18px;text-align:center}
@media print{header button,.tabs,.strip,.noprint{display:none}body{background:#fff}}
</style></head>
<body>
<header><div class="logo">ס</div><div><h1>בקרת טכוגרף</h1><div class="sub">ח. סבן חומרי בניין · מחובר לטאבים: ארכיון טכוגרף, היסטוריית ביקורים, אתרי לקוחות, ערים</div></div></header>
<div class="wrap">
<div class="strip" id="strip"></div>
<div class="tabs"><button class="tab on" data-t="day">היום</button><button class="tab" data-t="sites">כתובות לקוחות</button><button class="tab" data-t="cities">ערים ומרחקים</button></div>
<div id="app"><div class="empty">טוען נתונים מהגיליון…</div></div>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null,cur=null,tab='day';
const num=v=>{const x=parseFloat(String(v).replace(/,/g,''));return isNaN(x)?null:x};
const med=a=>{a=a.filter(x=>x!=null&&x>0).sort((x,y)=>x-y);return a.length?a[Math.floor((a.length-1)/2)]:null};
function ymd(s){const m=String(s||'').match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/);if(!m)return String(s||'').slice(0,10);let y=+m[3];if(y<100)y+=2000;return y+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2)}
function plate(s){const d=String(s||'').replace(/\D/g,'');return d.length===8?d.replace(/(\d{3})(\d{2})(\d{3})/,'$1-$2-$3'):''}
const eDate=d=>ymd(d['תאריך מתוקן']||d['תאריך דיסקית']),ePlate=d=>plate(d['משאית מתוקנת']||d['רישוי / משאית']);
function flags(d){const f=[],y=+eDate(d).slice(0,4);if(!y||y<2025||y>new Date().getFullYear()+1)f.push('שנה חשודה ב-OCR');if(!ePlate(d))f.push('רישוי לא תקני');if(!d['ק"מ פתיחה']&&!d['סה"כ ק"מ'])f.push('חסר קילומטראז׳');return f}
function visitsOf(d){const dt=eDate(d),p=ePlate(d);return D.visits.filter(v=>v['תאריך']===dt&&(!p||v['משאית']===p)).sort((a,b)=>(a['איתוראן: הגעה']||'99').localeCompare(b['איתוראן: הגעה']||'99'))}
const siteOf=k=>D.sites.find(s=>s['מפתח אתר']===k);

function init(r){D=r;cur=D.discs.length?D.discs[D.discs.length-1]._row:null;strip();render()}
function strip(){$('#strip').innerHTML=D.discs.map(d=>`<button class="disc ${d._row===cur?'on':''}" data-r="${d._row}"><b>${esc(eDate(d))}</b><small>${esc(ePlate(d)||'משאית ?')} · ${esc(d['סה"כ ק"מ']||d['ק"מ פתיחה']||'—')} ק״מ</small></button>`).join('')||'<div class="empty">אין דיסקיות בטאב</div>';
document.querySelectorAll('.disc').forEach(b=>b.onclick=()=>{cur=+b.dataset.r;strip();render()})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()});

function ring(vs){const R=110,C=130,pt=(h,r)=>{const a=(h/24)*2*Math.PI-Math.PI/2;return[C+r*Math.cos(a),C+r*Math.sin(a)]};
const hh=t=>{const m=String(t||'').match(/(\d{1,2}):(\d{2})/);return m?+m[1]+m[2]/60:null};
let s=`<svg viewBox="0 0 260 260" width="100%" role="img" aria-label="טבעת 24 שעות"><circle cx="130" cy="130" r="${R}" fill="none" stroke="var(--line)" stroke-width="22"/>`;
for(let h=0;h<24;h+=3){const[x,y]=pt(h,R+22);s+=`<text x="${x}" y="${y+3}" font-size="9" text-anchor="middle" fill="var(--mute)">${('0'+h).slice(-2)}</text>`}
let drawn=0;vs.forEach((v,i)=>{const a=hh(v['איתוראן: הגעה']),b=hh(v['איתוראן: יציאה']);if(a==null||b==null)return;drawn++;const[x1,y1]=pt(a,R),[x2,y2]=pt(b,R);
s+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${(b-a)>12?1:0} 1 ${x2} ${y2}" fill="none" stroke="var(--site)" stroke-width="22" opacity=".85"/>`;
const p1=hh(v['PTO פתיחה']),p2=hh(v['PTO סגירה']);if(p1!=null&&p2!=null){const[a1,b1]=pt(p1,R),[a2,b2]=pt(p2,R);s+=`<path d="M${a1} ${b1}A${R} ${R} 0 0 1 ${a2} ${b2}" fill="none" stroke="var(--pto)" stroke-width="22"/>`}
const[tx,ty]=pt((a+b)/2,R);s+=`<text x="${tx}" y="${ty+3}" font-size="10" font-weight="800" text-anchor="middle" fill="#fff">${i+1}</text>`});
return s+`</svg>`+(drawn?'':'<div class="empty">הטבעת תתמלא אוטומטית כשיוזרקו נתוני איתוראן ליום הזה</div>')}

function day(){const d=D.discs.find(x=>x._row===cur);if(!d)return'<div class="empty">בחר דיסקית</div>';
const vs=visitsOf(d),fl=flags(d),meas=vs.filter(v=>num(v['משך באתר לסידור (דק׳)'])>0),pto=vs.reduce((a,v)=>a+(num(v['PTO משך (דק׳)'])||0),0);
const kpi=(l,v)=>`<div class="k"><span>${l}</span><b>${esc(v||'—')}</b></div>`;
const rows=vs.map((v,i)=>{const s=siteOf(v['מפתח אתר']),on=num(v['משך באתר לסידור (דק׳)']),p50=s&&num(s['באתר חציון (דק׳)']),dv=on&&p50?on-p50:null;
return `<div class="stop"><div class="n">${i+1}</div><div><div class="t">${esc(v['כתובת'])}</div><div class="m">${esc(v['לקוחות'])}</div><div class="m">תעודות ${esc(v['תעודות'])}${v['איתוראן: הגעה']?` · ${esc(v['איתוראן: הגעה'])}–${esc(v['איתוראן: יציאה'])}`:''}</div>
${(v['דגלי איכות']||'').split('; ').filter(Boolean).map(f=>`<span class="chip warn">${esc(f)}</span>`).join('')}</div>
<div style="text-align:left"><b>${on?on+' דק׳':'—'}</b><div class="m">${esc(v['מקור המדידה']||'אין מדידה')}</div>${dv!=null?`<div class="m ${dv>10?'bad':'ok'}">${dv>0?'+':''}${Math.round(dv)} מול חציון האתר</div>`:''}</div></div>
${v['ק״מ מהעצירה הקודמת']?`<div class="leg">↓ ${esc(v['ק״מ מהעצירה הקודמת'])} ק״מ · ${esc(v['נסיעה מהעצירה הקודמת (דק׳)']||'?')} דק׳ נסיעה</div>`:''}`}).join('');
return `<div class="kpis">${kpi('ק״מ ביום',d['סה"כ ק"מ']||d['ק"מ פתיחה'])}${kpi('זמן נסיעה',d['זמן נסיעה'])}${kpi('זמן עבודה',d['זמן עבודה'])}${kpi('זמן סרק',d['זמן סרק'])}${kpi('עצירות לקוח',vs.length)}${kpi('PTO (איתוראן)',pto?pto+' דק׳':'')}${kpi('כיסוי מדידה',vs.length?Math.round(meas.length/vs.length*100)+'%':'')}</div>
<div class="grid"><div><div class="card"><h3>טבעת 24 שעות</h3>${ring(vs)}<div class="m">■ <span style="color:var(--site)">שהות באתר</span> ■ <span style="color:var(--pto)">PTO</span></div></div>
<div class="card noprint"><h3>אישור ותיקון</h3>${fl.map(f=>`<span class="chip bad">${esc(f)}</span>`).join('')||'<span class="chip ok">ללא חשדות OCR</span>'}
<p><input id="fd" placeholder="תאריך נכון dd/mm/yyyy" value="${esc(d['תאריך מתוקן']||'')}"> <input id="fp" placeholder="משאית 615-41-002" value="${esc(d['משאית מתוקנת']||'')}"></p>
<button class="btn" onclick="save(false)">שמור תיקון</button> <button class="btn" onclick="save(true)">אשר דיסקית</button>
<div class="m" style="margin-top:8px">${d['אושר ע״י']?`אושר: ${esc(d['אושר ע״י'])} · ${esc(d['אושר בתאריך'])}`:'טרם אושר'}</div></div>
<div class="card noprint"><h3>סריקת הדיסקית</h3><div class="scan" id="scan"><button class="btn ghost" onclick="scan()">${d._link?'טען סריקה':'אין קישור'}</button></div>
<p><button class="btn ghost" onclick="tf('rotate')">↻</button> <button class="btn ghost" onclick="tf('inv')">נגטיב</button> <button class="btn ghost" onclick="tf('zoom')">זום</button></p></div></div>
<div class="card"><h3>מסלול היום והצלבת תעודות (${vs.length} ביקורים)</h3>${rows||'<div class="empty">אין ביקורים לתאריך ולמשאית הזו. אם התאריך מוטעה ב-OCR, תקן אותו משמאל.</div>'}</div></div>`}

let T={r:0,i:0,z:1};
function tf(k){const im=$('#scan img');if(!im)return;if(k==='rotate')T.r=(T.r+90)%360;if(k==='inv')T.i=!T.i;if(k==='zoom')T.z=T.z>=2?1:T.z+.5;im.style.transform=`rotate(${T.r}deg) scale(${T.z})`;im.style.filter=T.i?'invert(1)':''}
function scan(){const d=D.discs.find(x=>x._row===cur);if(!d||!d._link)return;$('#scan').textContent='טוען…';google.script.run.withSuccessHandler(u=>{$('#scan').innerHTML=`<img src="${u}" alt="דיסקית">`;T={r:0,i:0,z:1}}).withFailureHandler(e=>{$('#scan').textContent='שגיאה: '+e.message}).getDiscImage(d._link)}
function save(approve){const d=D.discs.find(x=>x._row===cur);google.script.run.withSuccessHandler(()=>google.script.run.withSuccessHandler(init).getDashboardData()).withFailureHandler(e=>alert(e.message)).saveDisc(cur,{date:$('#fd').value.trim(),plate:$('#fp').value.trim(),approve:approve})}

function sites(){const q=($('#q')&&$('#q').value)||'',c=($('#c')&&$('#c').value)||'',cs=[...new Set(D.sites.map(s=>s['עיר']))].sort();
const L=D.sites.filter(s=>(!c||s['עיר']===c)&&(!q||(s['כתובת']+s['לקוחות']).includes(q)));
return `<div class="card"><p><input id="q" placeholder="חיפוש כתובת או לקוח" value="${esc(q)}" oninput="keep()"> <select id="c" onchange="keep()"><option value="">כל הערים</option>${cs.map(x=>`<option ${x===c?'selected':''}>${esc(x)}</option>`).join('')}</select></p>
<div style="overflow:auto;max-height:560px"><table><tr><th>כתובת</th><th>עיר</th><th>לקוחות</th><th>ביקורים</th><th>חציון</th><th>P80</th><th>נסיעה</th><th>ביטחון</th></tr>${L.map(s=>`<tr><td>${esc(s['כתובת'])}</td><td>${esc(s['עיר'])}</td><td class="m">${esc(s['לקוחות'])}</td><td>${esc(s['ביקורים'])}</td><td><b>${esc(s['באתר חציון (דק׳)']||'—')}</b></td><td>${esc(s['באתר P80 (דק׳)']||'—')}</td><td>${esc(s['נסיעה חציון (דק׳)']||'—')}</td><td>${esc(s['ביטחון'])}</td></tr>`).join('')}</table></div></div>`}
function keep(){const q=$('#q').value,c=$('#c').value;$('#app').innerHTML=sites();$('#q').value=q;$('#c').value=c;$('#q').focus()}

function cities(){const km={};D.visits.forEach(v=>{const k=v['עיר'];(km[k]=km[k]||[]).push(num(v['ק״מ מהעצירה הקודמת']))});
const mx=Math.max(1,...D.cities.map(c=>num(c['באתר P80 (דק׳)'])||0));
return `<div class="card"><h3>זמן באתר וקילומטרים לפי עיר</h3><table><tr><th>עיר</th><th>ביקורים</th><th>חציון באתר</th><th></th><th>P80</th><th>נסיעה (דק׳)</th><th>ק״מ חציון</th></tr>${D.cities.map(c=>{const p=num(c['באתר חציון (דק׳)'])||0,k=med(km[c['עיר']]||[]);return `<tr><td><b>${esc(c['עיר'])}</b></td><td>${esc(c['ביקורים'])}</td><td>${p||'—'}</td><td><div class="bar"><i style="width:${p/mx*100}%"></i></div></td><td>${esc(c['באתר P80 (דק׳)']||'—')}</td><td>${esc(c['נסיעה חציון (דק׳)']||'—')}</td><td>${k==null?'—':k}</td></tr>`}).join('')}</table><div class="m" style="margin-top:8px">נסיעה וק״מ מתמלאים אחרי הזרקת דוחות איתוראן.</div></div>`}

function render(){if(!D)return;$('#app').innerHTML=tab==='day'?day():tab==='sites'?sites():cities()}
google.script.run.withSuccessHandler(init).withFailureHandler(e=>{$('#app').innerHTML='<div class="empty bad">שגיאה בקריאת הגיליון: '+esc(e.message)+'</div>'}).getDashboardData();
</script></body></html>
