<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.8" />
  
  <!-- Truck Body -->
  <g transform="translate(64, 160)">
    <!-- Flatbed -->
    <rect x="20" y="140" width="220" height="30" rx="4" fill="#64748B" />
    
    <!-- Big bag on flatbed -->
    <rect x="50" y="60" width="85" height="80" rx="8" fill="#F59E0B" />
    <path d="M70,60 Q92,30 115,60" fill="none" stroke="#D97706" stroke-width="6" />
    <text x="92" y="105" font-family="sans-serif" font-weight="900" font-size="20" fill="#78350F" text-anchor="middle">סבן</text>

    <!-- Cement bags -->
    <rect x="145" y="85" width="80" height="55" rx="4" fill="#E2E8F0" />
    <text x="185" y="118" font-family="sans-serif" font-weight="bold" font-size="14" fill="#334155" text-anchor="middle">ח. סבן</text>

    <!-- Crane Arm -->
    <rect x="235" y="50" width="16" height="100" fill="#EF4444" rx="2" />
    <path d="M243,50 L110,-10 L70,30" fill="none" stroke="#EF4444" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="243" cy="50" r="10" fill="#B91C1C" />
    <line x1="70" y1="30" x2="70" y2="70" stroke="#F8FAFC" stroke-width="3" stroke-dasharray="4,3" />

    <!-- Truck Cab -->
    <path d="M255,80 L315,80 L345,120 L350,170 L255,170 Z" fill="#2563EB" />
    <!-- Cab Window -->
    <path d="M275,90 L310,90 L330,120 L275,120 Z" fill="#93C5FD" />
    <!-- Cab Door Line -->
    <line x1="275" y1="120" x2="275" y2="165" stroke="#1D4ED8" stroke-width="3" />
    <rect x="280" y="135" width="16" height="4" rx="2" fill="#F8FAFC" />

    <!-- Wheels -->
    <!-- Rear Wheel 1 -->
    <circle cx="65" cy="180" r="30" fill="#0F172A" stroke="#475569" stroke-width="6" />
    <circle cx="65" cy="180" r="12" fill="#CBD5E1" />
    <!-- Rear Wheel 2 -->
    <circle cx="140" cy="180" r="30" fill="#0F172A" stroke="#475569" stroke-width="6" />
    <circle cx="140" cy="180" r="12" fill="#CBD5E1" />
    <!-- Front Wheel -->
    <circle cx="310" cy="180" r="30" fill="#0F172A" stroke="#475569" stroke-width="6" />
    <circle cx="310" cy="180" r="12" fill="#CBD5E1" />

    <!-- Headlight -->
    <polygon points="350,140 355,140 355,152 350,152" fill="#FEF08A" />
  </g>

  <!-- Text Header -->
  <text x="256" y="440" font-family="sans-serif" font-weight="800" font-size="34" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">SABAN FLOW</text>
  <text x="256" y="475" font-family="sans-serif" font-weight="600" font-size="20" fill="#93C5FD" text-anchor="middle">ח. סבן לוגיסטיקה</text>
</svg>
